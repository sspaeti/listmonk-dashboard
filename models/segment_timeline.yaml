# Month-end snapshots: how many subscribers were in both lists / list A only / list B only
# at the end of each month. A subscription counts as active from its creation until its status left
# 'confirmed' (approximated by updated_at). Subscriber blocklisting is not back-dated.
type: model
materialize: true

sql: |
  WITH s AS (
    SELECT subscriber_id, list_id, subscription_status, subscribed_at, status_changed_at
    FROM {{ ref "subscriptions" }}
    WHERE list_id IN ({{ .env.list_a_id }}, {{ .env.list_b_id }})
  ),
  months AS (
    SELECT unnest(generate_series(
      date_trunc('month', (SELECT min(subscribed_at) FROM s)),
      date_trunc('month', now()::TIMESTAMP),
      INTERVAL 1 MONTH)) AS month
  ),
  state AS (
    SELECT
      m.month,
      s.subscriber_id,
      bool_or(s.list_id = {{ .env.list_a_id }}
              AND (s.subscription_status = 'confirmed' OR s.status_changed_at >= m.month + INTERVAL 1 MONTH)) AS in_list_a,
      bool_or(s.list_id = {{ .env.list_b_id }}
              AND (s.subscription_status = 'confirmed' OR s.status_changed_at >= m.month + INTERVAL 1 MONTH)) AS in_list_b
    FROM months m
    JOIN s ON s.subscribed_at < m.month + INTERVAL 1 MONTH
    GROUP BY 1, 2
  )
  SELECT
    month,
    CASE
      WHEN in_list_a AND in_list_b THEN 'Both lists'
      WHEN in_list_a                 THEN 'List A only'
      WHEN in_list_b                 THEN 'List B only'
      ELSE 'Neither'
    END AS segment,
    count(*) AS subscribers
  FROM state
  GROUP BY 1, 2
