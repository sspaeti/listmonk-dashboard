# listmonk campaigns (metadata only, no body).
type: model
materialize: true

refresh:
  cron: "0 6 * * *"

pre_exec: ATTACH IF NOT EXISTS 'host={{ .env.LISTMONK_PG_HOST }} port={{ .env.LISTMONK_PORT }} dbname={{ .env.LISTMONK_DATABASE }} user={{ .env.LISTMONK_USER }} password={{ .env.LISTMONK_PGPASSWORD }}' AS lm (TYPE postgres, READ_ONLY)
sql: |
  SELECT
    id,
    uuid::VARCHAR AS uuid,
    name,
    subject,
    status::VARCHAR AS status,
    type::VARCHAR AS type,
    tags,
    from_email,
    to_send,
    sent,
    send_at::TIMESTAMP AS send_at,
    started_at::TIMESTAMP AS started_at,
    created_at::TIMESTAMP AS created_at,
    updated_at::TIMESTAMP AS updated_at
  FROM lm.public.campaigns
