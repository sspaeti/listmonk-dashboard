# Raw link click events with the clicked URL.
type: model
materialize: true

refresh:
  cron: "0 6 * * *"

pre_exec: ATTACH IF NOT EXISTS 'host={{ .env.LISTMONK_PG_HOST }} port={{ .env.LISTMONK_PORT }} dbname={{ .env.LISTMONK_DATABASE }} user={{ .env.LISTMONK_USER }} password={{ .env.LISTMONK_PGPASSWORD }}' AS lm (TYPE postgres, READ_ONLY)
sql: |
  SELECT
    lc.id,
    lc.campaign_id,
    lc.link_id,
    l.url,
    lc.subscriber_id,
    lc.created_at::TIMESTAMP AS created_at
  FROM lm.public.link_clicks lc
  LEFT JOIN lm.public.links l ON l.id = lc.link_id
