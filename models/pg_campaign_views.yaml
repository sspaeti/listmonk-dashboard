# Raw open-pixel events. subscriber_id is NULL when individual tracking was off.
type: model
materialize: true

refresh:
  cron: "0 6 * * *"

pre_exec: ATTACH IF NOT EXISTS 'host={{ .env.LISTMONK_PG_HOST }} port={{ .env.LISTMONK_PORT }} dbname={{ .env.LISTMONK_DATABASE }} user={{ .env.LISTMONK_USER }} password={{ .env.LISTMONK_PGPASSWORD }}' AS lm (TYPE postgres, READ_ONLY)
sql: |
  SELECT id, campaign_id, subscriber_id, created_at::TIMESTAMP AS created_at
  FROM lm.public.campaign_views
